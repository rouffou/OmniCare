name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OmniCare.slnx

      - name: Build
        run: dotnet build OmniCare.slnx --no-restore --configuration Release

      - name: Tests
        run: dotnet test OmniCare.slnx --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14
